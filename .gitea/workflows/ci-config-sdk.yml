name: Build, Test, and Publish Config SDK (Java)

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    paths:
      - "config-sdk-java/**"
      - ".gitea/workflows/ci-config-sdk.yml"

jobs:
  config-sdk-java:
    name: Build, Test, and Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Runs spotless, checkstyle, and all unit tests — same gate as a local `./gradlew check`.
      - name: Build and check
        run: ./gradlew check --no-daemon
        working-directory: config-sdk-java

      # Only tagged releases (v*.*.*) get published — every other branch push just builds/tests.
      # Mirrors the semver-tag convention the Docker-publishing workflows already use.
      - name: Publish to Gitea Package Registry
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew publishAllPublicationsToGiteaPackagesRepository --no-daemon
        working-directory: config-sdk-java
        env:
          GITEA_PACKAGE_OWNER: ${{ gitea.repository_owner }}
          PACKAGE_REGISTRY_TOKEN: ${{ secrets.PACKAGE_REGISTRY_TOKEN }}
