name: Auto PR develop -> main

on:
  push:
    branches:
      - develop   # triggers on push to develop branch

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check for existing open develop->main PR
        id: check
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/pulls?state=open&type=all")

          EXISTING=$(echo "$RESPONSE" | jq -r '.[] | select(.base.ref=="main" and .head.ref=="develop") | .number' | head -n1)

          if [ -n "$EXISTING" ]; then
            echo "Found existing PR #$EXISTING — skipping."
            echo "exists=true" >> "$GITEA_OUTPUT"
          else
            echo "exists=false" >> "$GITEA_OUTPUT"
          fi

      - name: Create PR
        if: steps.check.outputs.exists == 'false'
        run: |
          HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITEA_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
                  "title": "Sync: develop -> main",
                  "head": "develop",
                  "base": "main",
                  "body": "Automatically opened by CI after a change on develop."
                }' \
            "${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/pulls")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "PR created."
          else
            echo "PR creation returned $HTTP_CODE (likely nothing to merge — that's fine):"
            cat /tmp/resp.json
          fi