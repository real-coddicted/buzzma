spring:
  application:
    name: buzzma-communications
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        stringtype: unspecified
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Separate history table from backend's flyway_schema_history.
    table: flyway_schema_history_communications
    # This module shares backend's Postgres schema, so it is always non-empty
    # on communications' first-ever run in any environment. Baseline below
    # V0001 (version 1) so that migration still runs after baselining.
    baseline-on-migrate: true
    baseline-version: 0
    user: ${FLYWAY_MIGRATOR_USER:}
    password: ${FLYWAY_MIGRATOR_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${EMAIL_SMTP_HOST:smtp.gmail.com}
    port: ${EMAIL_SMTP_PORT:587}
    username: ${EMAIL_SMTP_USERNAME:}
    password: ${EMAIL_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8083}

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-me-access-secret-min-32-chars!!}
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    api-version: ${WHATSAPP_API_VERSION:v21.0}
    graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
  email:
    from-address: ${EMAIL_FROM_ADDRESS:donotreply@buzzmah.com}
    outbox:
      worker-pool-size: ${EMAIL_OUTBOX_WORKER_POOL_SIZE:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p ${PID:- } --- [%15.15t] %-40.40logger{39}:%line : %m%n%wEx"
  level:
    com.coddicted.buzzma.communications: INFO
