plugins {
  id 'java-library'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'com.diffplug.spotless' version '8.4.0'
  id 'checkstyle'
  id 'maven-publish'
}

group = 'com.coddicted.buzzma'
version = '0.1.0-SNAPSHOT'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
  withSourcesJar()
}

repositories {
  mavenCentral()
}

ext {
  springBootVersion = '3.3.4'
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
  }
}

dependencies {
  // Spring Boot Starter conventions: autoconfigured beans, application.yml-driven properties.
  // This module is a library, not an application — it never applies the Boot plugin.
  api 'org.springframework.boot:spring-boot-starter'
  api 'org.springframework.boot:spring-boot-autoconfigure'

  // RestClient lives in spring-web; consuming apps' own web stack is irrelevant to the SDK.
  implementation 'org.springframework:spring-web'

  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

  // Actuator/Micrometer are optional — the SDK degrades gracefully when either is absent
  // from the consuming app's classpath (see ConfigSdkAutoConfiguration @ConditionalOnClass).
  compileOnly 'org.springframework.boot:spring-boot-actuator'
  compileOnly 'io.micrometer:micrometer-core'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-actuator'
  testImplementation 'io.micrometer:micrometer-core'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
  java {
    target 'src/*/java/**/*.java'
    googleJavaFormat()
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

checkstyle {
  toolVersion = '10.17.0'
  configFile = file('config/checkstyle/google_checks.xml')
  checkstyleTest.enabled = false
  maxWarnings = 0
}

tasks.named('spotlessJavaCheck') {
  dependsOn 'spotlessJavaApply'
}

tasks.named('check') {
  dependsOn 'spotlessCheck'
}

tasks.named('test') {
  useJUnitPlatform()
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }
  // Internal Maven/Gradle repo coordinates are not yet provisioned for this repo — add the
  // `repositories { maven { ... } }` block here once one exists (see design doc §7 "Distribution").
}
