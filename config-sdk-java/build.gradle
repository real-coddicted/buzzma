plugins {
  id 'java-library'
  id 'io.spring.dependency-management' version '1.1.6'
  id 'com.diffplug.spotless' version '8.4.0'
  id 'checkstyle'
  id 'maven-publish'
}

group = 'com.coddicted.buzzma'
version = '0.1.0'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
  withSourcesJar()
}

repositories {
  mavenCentral()
}

ext {
  springBootVersion = '3.3.4'
}

dependencyManagement {
  imports {
    mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
  }
}

dependencies {
  // Spring Boot Starter conventions: autoconfigured beans, application.yml-driven properties.
  // This module is a library, not an application — it never applies the Boot plugin.
  api 'org.springframework.boot:spring-boot-starter'
  api 'org.springframework.boot:spring-boot-autoconfigure'

  // RestClient lives in spring-web; consuming apps' own web stack is irrelevant to the SDK.
  implementation 'org.springframework:spring-web'

  implementation 'com.fasterxml.jackson.core:jackson-databind'
  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

  // Actuator/Micrometer are optional — the SDK degrades gracefully when either is absent
  // from the consuming app's classpath (see ConfigSdkAutoConfiguration @ConditionalOnClass).
  compileOnly 'org.springframework.boot:spring-boot-actuator'
  compileOnly 'io.micrometer:micrometer-core'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-actuator'
  testImplementation 'io.micrometer:micrometer-core'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

spotless {
  java {
    target 'src/*/java/**/*.java'
    googleJavaFormat()
    removeUnusedImports()
    trimTrailingWhitespace()
    endWithNewline()
  }
}

checkstyle {
  toolVersion = '10.17.0'
  configFile = file('config/checkstyle/google_checks.xml')
  checkstyleTest.enabled = false
  maxWarnings = 0
}

tasks.named('spotlessJavaCheck') {
  dependsOn 'spotlessJavaApply'
}

tasks.named('check') {
  dependsOn 'spotlessCheck'
}

tasks.named('test') {
  useJUnitPlatform()
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }

  // io.spring.dependency-management resolves BOM versions onto the classic POM correctly, but
  // doesn't populate them into Gradle Module Metadata — harmless for Maven-based consumers, who
  // read the POM either way, but the module metadata task's stricter validation fails without this.
  tasks.withType(GenerateModuleMetadata).configureEach {
    suppressedValidationErrors.add('dependencies-without-versions')
  }

  repositories {
    // Always available, no credentials needed — `./gradlew publishToMavenLocal` for local dev,
    // e.g. iterating on a consuming module before a real release is published.
    mavenLocal()

    // Gitea's built-in Maven package registry, same instance already used for this repo's Docker
    // images. Only usable when PACKAGE_REGISTRY_TOKEN is set (CI); local `./gradlew publish` without
    // it will fail just this one target, not `publishToMavenLocal`. See ci-config-sdk.yml.
    maven {
      name = 'giteaPackages'
      url = uri(
          "https://gitea.local.coddicted.com/api/packages/" +
          "${System.getenv('GITEA_PACKAGE_OWNER') ?: 'coddicted'}/maven")
      credentials(HttpHeaderCredentials) {
        name = 'Authorization'
        value = "token ${System.getenv('PACKAGE_REGISTRY_TOKEN') ?: ''}"
      }
      authentication {
        header(HttpHeaderAuthentication)
      }
    }
  }
}
